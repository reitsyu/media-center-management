name: Deploy Media Center Web App

# Manual trigger only — go to the "Actions" tab on GitHub, pick this workflow,
# and click "Run workflow" whenever you want to push the latest files live.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          # Change this if your index.html/manifest.json/sw.js/icons live in a
          # subfolder instead of the repo root (e.g. "./site").
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
